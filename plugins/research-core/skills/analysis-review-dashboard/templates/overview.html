<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{WORKFLOW_TITLE}}</title><link rel="stylesheet" href="review.css"><script src="review.js" defer></script></head>
<body><main class="shell">
<header><p class="eyebrow">{{PROJECT_AND_SCOPE}}</p><h1>{{WORKFLOW_TITLE}}</h1><p class="intro">{{SCIENTIFIC_SUMMARY}}</p>{{OPTIONAL_REVIEW_STATE}}</header>
<section aria-labelledby="task-map-title"><h2 id="task-map-title">Analysis tasks</h2><div class="task-map">{{TASK_DIAGRAM}}</div></section>
<section aria-labelledby="outputs-title"><h2 id="outputs-title">{{MAIN_OUTPUTS_HEADING}}</h2><div class="gallery">{{REAL_MAIN_OUTPUT_CARDS}}</div></section>
<details class="records"><summary>{{OUTPUT_FILES_AND_SOURCE_RECORDS_HEADING}}</summary>{{PAGE_OUTPUT_SOURCE_RECORDS}}</details>
<footer>{{SOURCE_AND_CAPTURE_NOTE}}</footer>
</main><dialog id="figure-dialog"><div class="dialog-head"><h2 id="figure-title"></h2><button type="button" data-close-figure>Close</button></div><img id="figure-image" alt=""></dialog>
<div id="notice" role="status" hidden></div></body></html>
